{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "day-pilot.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "day-pilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  WEATHERAPI_API_KEY: {{ .Values.secrets.weatherapiApiKey | quote }}
  NTFY_TOPIC: {{ .Values.secrets.ntfyTopic | quote }}
  NTFY_TOKEN: {{ .Values.secrets.ntfyToken | quote }}
  CALDAV_URL: {{ .Values.secrets.caldavUrl | quote }}
  CALDAV_USERNAME: {{ .Values.secrets.caldavUsername | quote }}
  CALDAV_PASSWORD: {{ .Values.secrets.caldavPassword | quote }}
  VOICE_WEBHOOK_SECRET: {{ .Values.secrets.voiceWebhookSecret | quote }}
  {{- if .Values.secrets.googleCredentialsJson }}
  GOOGLE_CREDENTIALS_CONTENT: {{ .Values.secrets.googleCredentialsJson | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "day-pilot.postgresql.host" .) .Values.postgresql.auth.database | quote }}
  {{- end }}
{{- end }}
