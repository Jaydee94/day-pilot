services:
  # ---------------------------------------------------------------------------
  # PostgreSQL – primary data store
  # ---------------------------------------------------------------------------
  db:
    image: postgres:17-alpine
    container_name: day-pilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daypilot}
      POSTGRES_USER: ${POSTGRES_USER:-daypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daypilot}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - daypilot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daypilot} -d ${POSTGRES_DB:-daypilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis – job queue and cache
  # ---------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: day-pilot-cache
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - cache-data:/data
    networks:
      - daypilot-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Backend – FastAPI application
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: day-pilot-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-daypilot}:${POSTGRES_PASSWORD:-daypilot}@db:5432/${POSTGRES_DB:-daypilot}
      - REDIS_URL=redis://cache:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data        # persists Google OAuth token and other state
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - daypilot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Frontend – React PWA served via nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty so the built JS uses a relative /api path (proxied by
        # nginx). Set VITE_API_URL in .env only when a split-origin setup is
        # needed (e.g. frontend and backend on different ports/hosts).
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: day-pilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - daypilot-net

networks:
  daypilot-net:
    driver: bridge

volumes:
  db-data:
  cache-data:
