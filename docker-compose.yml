services:
  # ---------------------------------------------------------------------------
  # Backend – FastAPI application
  #
  # Day Pilot persists all of its state (local events, todos, shopping list,
  # family profiles, settings, Google OAuth token, notification dedup markers)
  # as JSON files under /app/data. That directory is bind-mounted below, so a
  # database/cache service is intentionally NOT part of this stack.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: day-pilot-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data        # persistent state: JSON store + Google OAuth token
    networks:
      - daypilot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ---------------------------------------------------------------------------
  # Frontend – React PWA served via nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave empty so the built JS uses a relative /api path (proxied by
        # nginx). Set VITE_API_URL in .env only when a split-origin setup is
        # needed (e.g. frontend and backend on different ports/hosts).
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: day-pilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - daypilot-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  daypilot-net:
    driver: bridge
