<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 72" fill="none">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="8" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Icon background -->
  <rect x="0" y="8" width="56" height="56" rx="13" fill="url(#iconBg)"/>
  <!-- Paper airplane pointing upper-right (scaled to fit icon) -->
  <path d="M44 20 L9 55 L32 47 Z" fill="white"/>
  <path d="M32 47 L25 62 L9 55 Z" fill="rgba(255,255,255,0.6)"/>
  <line x1="44" y1="20" x2="32" y2="47" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- App name -->
  <text x="70" y="45"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1F2937">Day</tspan><tspan fill="#4F8EF7">Pilot</tspan>
  </text>
  <!-- Tagline -->
  <text x="70" y="62"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12" fill="#6B7280">your daily co-pilot</text>
</svg>
