[tool.poetry]
name = "day-pilot-backend"
version = "0.1.0"
description = "Day Pilot backend API"
authors = ["Day Pilot Team"]
readme = "../README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "0.115.12"
uvicorn = { version = "0.34.2", extras = ["standard"] }
httpx = "0.28.1"
pydantic = "2.11.3"
pydantic-settings = "2.8.1"
apscheduler = "3.11.0"
google-auth = "2.40.1"
google-auth-oauthlib = "1.2.2"
google-api-python-client = "2.169.0"
caldav = "1.4.0"
vobject = "0.9.6.1"
openai = "1.76.0"
python-dotenv = "1.1.0"
requests = "2.32.3"
pytz = "2025.2"
python-dateutil = "2.9.0.post0"
python-multipart = "0.0.22"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
pytest-asyncio = "0.25.3"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
